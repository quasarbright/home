<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

    <ul class="index">
      <li class="kind-projects">

        <span class="n" data-count="projects"></span>
        <span class="latest" data-latest="projects"></span>

      <li class="kind-videos">

        <span class="n" data-count="videos"></span>
        <span class="latest" data-latest="videos"></span>
      </li>
      <li class="kind-writing">
        <a class="k" href="/blog/">Writing</a>
        <span class="n" data-count="writing"></span>
        <span class="latest" data-latest="writing"></span>
      </li>
      <li class="kind-art">
        <a class="k" href="https://x.com/QuasarBright">Art</a>
        <span class="n"></span>
        <span class="latest"><a href="https://x.com/QuasarBright">@QuasarBright on X</a></span>
